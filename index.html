<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT Cinema | Official Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #131824;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .banner-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            position: relative;
        }
        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85);
        }
        .profile-section {
            text-align: center;
            margin-top: -50px;
            position: relative;
            padding: 0 20px;
        }
        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #131824;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            background: #1f293d;
        }
        .channel-title {
            font-size: 24px;
            font-weight: 700;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        .channel-desc {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 5px;
            padding: 0 10px;
        }
        .cta-container {
            padding: 25px 20px;
            text-align: center;
        }
        .youtube-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }
        .youtube-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 0, 0, 0.6);
            background: linear-gradient(135deg, #ff1a1a, #e60000);
        }
        .youtube-btn svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }
        .gallery-section {
            padding: 0 20px 25px 20px;
        }
        .section-heading {
            font-size: 15px;
            font-weight: 600;
            color: #d1d5db;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 3px solid #ff0000;
            padding-left: 8px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .photo-grid img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 2, 0.1);
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #6b7280;
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="banner-container">
            <img src="banner.jpg" alt="MT Cinema Banner">
        </div>

        <div class="profile-section">
            <img src="logo.jpg" alt="MT Cinema Logo" class="logo-img">
            <h1 class="channel-title">MT CINEMA</h1>
            <p class="channel-desc">Independent Short Films, Suspense Thrillers & Clean Entertainment.</p>
        </div>

        <div class="cta-container">
            <!-- Direct YouTube App Deep Link Intent -->
            <a href="intent://www.youtube.com/@mtcinema_official#{package;S.com.google.android.youtube;end;}" class="youtube-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                Watch on YouTube
            </a>
        </div>

        <div class="gallery-section">
            <div class="section-heading">Behind The Scenes & Team</div>
            <div class="photo-grid">
                <img src="shot1.jpg" alt="Scene 1">
                <img src="shot2.jpg" alt="Team">
                <img src="shot3.jpg" alt="Shoot">
            </div>
        </div>

        <div class="footer">
            &copy; 2026 MT Cinema. All Rights Reserved.
        </div>
    </div>

</body>
</html>
